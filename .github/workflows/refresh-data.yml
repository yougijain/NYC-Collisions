name: Refresh dataset

# The city republishes collisions in batches with a multi-week reporting lag,
# so a weekly pull keeps the dashboard as current as the source allows.
on:
  schedule:
    - cron: "17 7 * * 1" # Mondays, 07:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild the whole window instead of refreshing the tail"
        type: boolean
        default: false

# Required to publish the dataset as a Release asset.
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  RELEASE_TAG: data-latest
  ASSET: data/clean/collisions.parquet
  COUNTS: data/clean/traffic_volume.parquet

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # The ML extras are needed to rescore the watchlist below.
        run: pip install -r requirements-ml.txt

      - name: Fetch the current dataset
        # Incremental builds need the previous Parquet; a fresh runner has
        # none, and neither does the very first run. Either way, absence
        # just means build_dataset.py does a full build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern collisions.parquet \
            --dir data/clean \
            || echo "No published dataset yet; will build from scratch."

      - name: Build dataset
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python scripts/build_dataset.py \
            ${{ (inputs.full && '--full') || '' }}

      - name: Validate
        # Gate publication on the dataset contract, so a bad upstream day
        # cannot replace a good published asset.
        env:
          NYC_COLLISIONS_DATA: ${{ env.ASSET }}
        run: pytest tests/ -q

      - name: Summarise
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import pandas as pd

          df = pd.read_parquet(os.environ["ASSET"])
          size_mb = os.path.getsize(os.environ["ASSET"]) / (1024 * 1024)
          print("### Dataset refreshed\n")
          print(f"- Rows: {len(df):,}")
          print(f"- Range: {df.crash_datetime.min()} to {df.crash_datetime.max()}")
          print(f"- Size: {size_mb:.1f} MB")
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "Latest collisions dataset" \
              --notes "Rebuilt weekly from NYC Open Data (h9gi-nx95) by .github/workflows/refresh-data.yml."

          gh release upload "$RELEASE_TAG" "$ASSET" --clobber

      - name: Regenerate the published figures
        # Every count quoted about this project comes from these two files.
        # Rebuilding them here is what stops the repository from describing
        # a build it stopped shipping months ago.
        env:
          NYC_COLLISIONS_DATA: ${{ env.ASSET }}
        run: |
          python scripts/dataset_facts.py
          python scripts/data_quality_report.py

      - name: Fetch the traffic counts
        # Published by .github/workflows/traffic-volume.yml, which runs on
        # demand because DOT republishes in occasional batches. If it has
        # never run, the exposure step below is skipped rather than failing
        # the refresh: the watchlist does not depend on it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern traffic_volume.parquet \
            --dir data/clean \
            || echo "No published traffic counts yet."

      - name: Rescore the injury risk model
        # Six model fits: one for the reported metrics and five rolling-origin
        # folds for the watchlist. A few minutes a week, against a model card
        # that would otherwise quote a build from last year -- which is the
        # failure this pipeline exists to prevent.
        env:
          NYC_COLLISIONS_DATA: ${{ env.ASSET }}
        run: |
          python scripts/train_injury_risk.py
          python scripts/build_watchlist.py

      - name: Rebuild the exposure join
        # The watchlist moves every week, so the sites a counter is attached
        # to move with it. Rerunning here keeps injury_exposure.csv about the
        # list actually being published rather than last week's.
        if: hashFiles('data/clean/traffic_volume.parquet') != ''
        env:
          NYC_COLLISIONS_DATA: ${{ env.ASSET }}
        run: python scripts/build_exposure.py

      - name: Rewrite the figures in the prose
        env:
          NYC_COLLISIONS_DATA: ${{ env.ASSET }}
        run: python scripts/sync_docs.py

      - name: Commit the figures and scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dataset_facts.json \
                  docs/dataset_facts.md \
                  data/clean/data_quality_report.txt \
                  data/clean/injury_watchlist.csv \
                  data/clean/injury_risk_factors.csv \
                  data/clean/watchlist_summary.json \
                  data/clean/injury_exposure.csv \
                  data/clean/exposure_summary.json \
                  reports/injury_risk/ \
                  README.md \
                  docs/model_card.md

          if git diff --cached --quiet; then
            echo "Figures unchanged."
            exit 0
          fi

          git commit -m "chore(data): refresh figures and rescore the watchlist"
          # The scheduled run is the only writer, but the branch can still
          # have moved between checkout and here.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
