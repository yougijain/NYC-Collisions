# Keep in step with app/palette.py: the surface and ink values are shared,
# and the chart colours were validated against this exact background.
[theme]
base = "light"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
primaryColor = "#2a78d6"
linkColor = "#256abf"
borderColor = "#e1e0d9"

# The reference palette calls for a system sans throughout and no display
# face; large figures keep proportional numerals.
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "small"
showWidgetBorder = true
